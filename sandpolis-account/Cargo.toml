[package]
description = "Virtual estate monitoring & management!"
edition = "2024"
license = "Unlicense"
name = "sandpolis-account"
version = "0.0.1"

[dependencies]
anyhow = { workspace = true }
validator = { workspace = true }
native_db = { workspace = true }
native_model = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
inventory = { workspace = true }
chrono = { workspace = true }
serde_cbor = { workspace = true, optional = true }

# Scraping (server only)
reqwest = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
url = { workspace = true, optional = true }
sandpolis-instance = { path = "../sandpolis-instance", version = "0.0.1" }
sandpolis-macros = { path = "../sandpolis-macros", version = "0.0.1" }

# GUI dependencies
bevy = { workspace = true, optional = true }
bevy_svg = { workspace = true, optional = true, features = ["2d"] }
bevy_rapier2d = { workspace = true, optional = true }
sandpolis-client = { path = "../sandpolis-client", version = "0.0.1", optional = true }

[features]
agent = []
server = ["dep:reqwest", "dep:regex", "dep:url", "sandpolis-instance/server"]
client = [
  "sandpolis-instance/client",
  "dep:bevy",
  "dep:bevy_svg",
  "dep:bevy_rapier2d",
  "dep:serde_cbor",
  "dep:sandpolis-client",
  "sandpolis-client/client",
]
