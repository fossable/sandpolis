<?xml version="1.0" encoding="UTF-8"?>
<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- NFS network file share icon -->
  <defs>
    <linearGradient id="nfsGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Folder tab -->
  <path d="M6 14 L6 11 a2 2 0 0 1 2 -2 l8 0 l3 4 l0 1 Z" fill="#b45309"/>

  <!-- Folder body -->
  <rect x="6" y="13" width="36" height="23" rx="3" fill="url(#nfsGradient)" stroke="#b45309" stroke-width="2"/>

  <!-- Export nodes, showing the share reaching several clients -->
  <circle cx="16" cy="21" r="3" fill="#fef3c7"/>
  <circle cx="32" cy="21" r="3" fill="#fef3c7"/>
  <circle cx="24" cy="31" r="3" fill="#fef3c7"/>
  <line x1="16" y1="21" x2="24" y2="31" stroke="#fef3c7" stroke-width="1.5"/>
  <line x1="32" y1="21" x2="24" y2="31" stroke="#fef3c7" stroke-width="1.5"/>
  <line x1="16" y1="21" x2="32" y2="21" stroke="#fef3c7" stroke-width="1.5"/>
</svg>
