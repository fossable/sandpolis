<?xml version="1.0" encoding="UTF-8"?>
<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- SMB/CIFS shared drive icon -->
  <defs>
    <linearGradient id="smbGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Drive body -->
  <rect x="6" y="16" width="36" height="18" rx="3" fill="url(#smbGradient)" stroke="#0369a1" stroke-width="2"/>

  <!-- Drive slot -->
  <rect x="10" y="21" width="20" height="3" rx="1.5" fill="#e0f2fe"/>

  <!-- Activity light -->
  <circle cx="36" cy="22" r="2" fill="#4ade80"/>

  <!-- Share arms below the drive -->
  <line x1="24" y1="34" x2="24" y2="38" stroke="#0369a1" stroke-width="2"/>
  <line x1="13" y1="38" x2="35" y2="38" stroke="#0369a1" stroke-width="2"/>
  <line x1="13" y1="38" x2="13" y2="41" stroke="#0369a1" stroke-width="2"/>
  <line x1="35" y1="38" x2="35" y2="41" stroke="#0369a1" stroke-width="2"/>
  <circle cx="13" cy="42" r="2.5" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <circle cx="35" cy="42" r="2.5" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
</svg>
