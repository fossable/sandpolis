<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Device class "mobile" for the Inventory layer. Shares the palette of
       layer/Inventory.svg. -->
  <defs>
    <linearGradient id="inventoryMobileGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2472a4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Body -->
  <rect x="20" y="6" width="24" height="52" rx="4" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>

  <!-- Screen -->
  <rect x="23" y="13" width="18" height="34" fill="url(#inventoryMobileGradient)"/>

  <!-- Earpiece and home button -->
  <rect x="28" y="9" width="8" height="2" rx="1" fill="#95a5a6"/>
  <circle cx="32" cy="52" r="3" fill="#7f8c8d"/>
</svg>
