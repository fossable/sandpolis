<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Device class "server" for the Inventory layer: stacked rack units. This
       is also the fallback class, so it covers anything not identified as a
       phone or a workstation. Shares the palette of layer/Inventory.svg. -->

  <!-- Rack units -->
  <rect x="10" y="10" width="44" height="14" rx="2" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
  <rect x="10" y="26" width="44" height="14" rx="2" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
  <rect x="10" y="42" width="44" height="14" rx="2" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>

  <!-- Drive bays -->
  <rect x="15" y="15" width="20" height="4" rx="1" fill="#7f8c8d"/>
  <rect x="15" y="31" width="20" height="4" rx="1" fill="#7f8c8d"/>
  <rect x="15" y="47" width="20" height="4" rx="1" fill="#7f8c8d"/>

  <!-- Status LEDs -->
  <circle cx="45" cy="17" r="2.5" fill="#2ecc71"/>
  <circle cx="45" cy="33" r="2.5" fill="#2ecc71"/>
  <circle cx="45" cy="49" r="2.5" fill="#2ecc71"/>
</svg>
