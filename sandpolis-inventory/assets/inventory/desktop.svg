<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Device class "desktop" for the Inventory layer: tower plus monitor.
       Shares the palette of layer/Inventory.svg. -->
  <defs>
    <linearGradient id="inventoryDesktopGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2472a4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Monitor -->
  <rect x="4" y="12" width="38" height="27" rx="2" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
  <rect x="8" y="16" width="30" height="19" fill="url(#inventoryDesktopGradient)"/>
  <rect x="19" y="39" width="8" height="6" fill="#34495e"/>
  <rect x="12" y="45" width="22" height="3" rx="1" fill="#2c3e50"/>

  <!-- Tower -->
  <rect x="46" y="20" width="14" height="28" rx="2" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
  <rect x="49" y="24" width="8" height="2" fill="#95a5a6"/>
  <rect x="49" y="28" width="8" height="2" fill="#95a5a6"/>
  <circle cx="53" cy="42" r="2.5" fill="#7f8c8d"/>
</svg>
