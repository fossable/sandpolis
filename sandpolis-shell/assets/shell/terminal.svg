<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Node icon for the Shell layer. Shares the palette of layer/Shell.svg so
       the layer indicator and the nodes it marks read as the same thing. -->

  <!-- Terminal window -->
  <rect x="6" y="12" width="52" height="40" rx="3" fill="#1e1e1e" stroke="#333333" stroke-width="2"/>

  <!-- Title bar -->
  <path d="M 6 15 a 3 3 0 0 1 3 -3 h 46 a 3 3 0 0 1 3 3 v 6 h -52 z" fill="#2d2d30"/>
  <circle cx="13" cy="17" r="2" fill="#ff5f56"/>
  <circle cx="20" cy="17" r="2" fill="#ffbd2e"/>
  <circle cx="27" cy="17" r="2" fill="#27c93f"/>

  <!-- Prompt chevron and cursor, drawn rather than typeset: bevy_svg renders
       this without a font database, so <text> would come out empty. -->
  <path d="M 13 29 L 19 34 L 13 39"
        fill="none" stroke="#4af626" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="23" y="37" width="12" height="3" rx="1" fill="#4af626"/>

  <!-- Output -->
  <rect x="13" y="44" width="26" height="2" fill="#888888"/>
</svg>
