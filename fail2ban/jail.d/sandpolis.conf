# Example jail for the Sandpolis server. Copy into /etc/fail2ban/jail.d/ and
# set enabled = true.

[sandpolis]
enabled = false
filter = sandpolis
port = 8768
maxretry = 5
findtime = 10m
bantime = 1h

# The server logs to stderr. Under systemd that lands in the journal, which
# the systemd backend reads directly (the filter's journalmatch expects the
# unit to be named sandpolis.service).
backend = systemd

# When not running under systemd, capture stderr to a file instead and point
# fail2ban at it:
# backend = auto
# logpath = /var/log/sandpolis/server.log
