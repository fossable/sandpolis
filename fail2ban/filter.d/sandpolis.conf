# Fail2ban filter for the Sandpolis server.
#
# Matches the canonical "Authentication failure" line the server logs at WARN
# whenever a login, token, or client-certificate check fails, e.g.:
#
#   2026-09-02T16:00:00.000000Z  WARN sandpolis_server::login::server: Authentication failure peer=203.0.113.7 username=admin

[Definition]
failregex = ^.*WARN.*Authentication failure.*peer=<HOST>\b
ignoreregex =
journalmatch = _SYSTEMD_UNIT=sandpolis.service
