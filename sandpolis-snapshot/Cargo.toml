[package]
description = "Virtual estate monitoring & management!"
edition = "2024"
license = "Unlicense"
name = "sandpolis-snapshot"
version = "0.0.1"

[dependencies]
anyhow = { workspace = true }
inventory = { workspace = true }
native_db = { workspace = true }
native_model = { workspace = true }
serde = { workspace = true }
serde_cbor = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
blake3 = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }
bevy = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sandpolis-instance = { path = "../sandpolis-instance", version = "0.0.1" }
sandpolis-macros = { path = "../sandpolis-macros", version = "0.0.1" }
sandpolis-agent = { path = "../sandpolis-agent", version = "0.0.1", optional = true }
sandpolis-client = { path = "../sandpolis-client", version = "0.0.1", optional = true }
sandpolis-inventory = { path = "../sandpolis-inventory", version = "0.0.1", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
test-log = { version = "0.2.18", features = ["trace"] }

[features]
agent = [
  "sandpolis-instance/agent",
  "dep:sandpolis-agent",
  "sandpolis-agent/agent",
  "dep:tokio",
  "dep:zstd",
  "dep:blake3",
]
server = [
  "sandpolis-instance/server",
  "dep:tokio",
  "dep:zstd",
  "dep:blake3",
]
client = [
  "sandpolis-instance/client",
  "dep:sandpolis-client",
  "sandpolis-client/client",
  "dep:sandpolis-inventory",
  "sandpolis-inventory/client",
  "dep:bevy",
  "dep:clap",
  "dep:serde_json",
  "dep:tokio",
]
