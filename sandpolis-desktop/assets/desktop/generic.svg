<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Node icon for the Desktop layer: a generic monitor, used until agents
       report which desktop environment they're running. Shares the palette of
       layer/Desktop.svg. -->
  <defs>
    <linearGradient id="desktopGenericGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2472a4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Bezel -->
  <rect x="6" y="12" width="52" height="34" rx="3" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>

  <!-- Screen -->
  <rect x="10" y="16" width="44" height="26" fill="url(#desktopGenericGradient)"/>

  <!-- Windows on the desktop -->
  <rect x="14" y="20" width="18" height="13" rx="1" fill="#ecf0f1" fill-opacity="0.85"/>
  <rect x="14" y="20" width="18" height="3" rx="1" fill="#bdc3c7" fill-opacity="0.85"/>
  <rect x="26" y="26" width="20" height="12" rx="1" fill="#ecf0f1" fill-opacity="0.7"/>
  <rect x="26" y="26" width="20" height="3" rx="1" fill="#bdc3c7" fill-opacity="0.7"/>

  <!-- Stand -->
  <rect x="28" y="46" width="8" height="7" fill="#34495e"/>
  <rect x="19" y="53" width="26" height="4" rx="2" fill="#2c3e50"/>
</svg>
