[package]
authors = ["Tyler Cook"]
description = "Virtual estate monitoring & management!"
edition = "2024"
license = "Unlicense"
name = "sandpolis"
repository = "https://github.com/fossable/sandpolis"
rust-version = "1.96"
version = "8.0.0"

[build-dependencies]
roniker = { workspace = true, features = ["analyze"] }
serde_json = { workspace = true }
walkdir = "2"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
colored = { workspace = true }
dirs = "6"
fossable = "0.1.2"
fs2 = "0.4"
futures = { workspace = true }
ron = { workspace = true }
native_db = { workspace = true }
os_info = { workspace = true }
rand = { workspace = true }
rustls = { workspace = true }
sandpolis-agent = { path = "../sandpolis-agent", version = "0.0.1" }
sandpolis-account = { path = "../sandpolis-account", version = "0.0.1", optional = true }
sandpolis-audit = { path = "../sandpolis-audit", version = "0.0.1", optional = true }
sandpolis-client = { path = "../sandpolis-client", version = "0.0.1" }
sandpolis-desktop = { path = "../sandpolis-desktop", version = "0.0.1", optional = true }
sandpolis-filesystem = { path = "../sandpolis-filesystem", version = "0.0.1", optional = true }
sandpolis-health = { path = "../sandpolis-health", version = "0.0.1", optional = true }
sandpolis-instance = { path = "../sandpolis-instance", version = "0.0.1" }
sandpolis-macros = { path = "../sandpolis-macros", version = "0.0.1" }
sandpolis-inventory = { path = "../sandpolis-inventory", version = "0.0.1", optional = true }
sandpolis-probe = { path = "../sandpolis-probe", version = "0.0.1", optional = true }
sandpolis-server = { path = "../sandpolis-server", version = "0.0.1" }
sandpolis-shell = { path = "../sandpolis-shell", version = "0.0.1", optional = true }
sandpolis-snapshot = { path = "../sandpolis-snapshot", version = "0.0.1", optional = true }
serde_json = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
strum = { workspace = true }
tempfile = { workspace = true }
tokio-stream = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
roniker = { workspace = true, optional = true, features = ["lsp"] }
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tracing = { workspace = true }
validator = { workspace = true }

# Server exclusive
axum-macros = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
axum-server = { workspace = true, optional = true }
axum = { workspace = true, optional = true }

# GUI client exclusive
bevy = { workspace = true, optional = true }
bevy_svg = { workspace = true, optional = true, features = ["2d"] }
bevy_rapier2d = { workspace = true, optional = true }
bevy_ui_widgets = { workspace = true, optional = true }

# Terminal (TUI/CLI) client deps, excluded on Android
[target.'cfg(not(target_os = "android"))'.dependencies]
ratatui = { workspace = true, optional = true }
ratatui-image = { workspace = true, optional = true }
image = { workspace = true, optional = true }
tui-popup = { workspace = true, optional = true }

[features]
# Instances
server = [
  "dep:axum",
  "dep:axum-server",
  "dep:axum-macros",
  "dep:notify",
  "sandpolis-account?/server",
  "sandpolis-agent/server",
  "sandpolis-audit?/server",
  "sandpolis-desktop?/server",
  "sandpolis-filesystem?/server",
  "sandpolis-health?/server",
  "sandpolis-instance/server",
  "sandpolis-inventory?/server",
  "sandpolis-probe?/server",
  "sandpolis-server/server",
  "sandpolis-shell?/server",
  "sandpolis-snapshot?/server",
]
agent = [
  "sandpolis-account?/agent",
  "sandpolis-agent/agent",
  "sandpolis-audit?/agent",
  "sandpolis-desktop?/agent",
  "sandpolis-filesystem?/agent",
  "sandpolis-health?/agent",
  "sandpolis-instance/agent",
  "sandpolis-inventory?/agent",
  "sandpolis-probe?/agent",
  "sandpolis-server/agent",
  "sandpolis-shell?/agent",
  "sandpolis-snapshot?/agent",
]
client = [
  "dep:roniker",
  "sandpolis-agent/client",
  "sandpolis-client/client",
  "sandpolis-instance/client",
  "sandpolis-server/client",
  # GUI (Bevy)
  "dep:bevy",
  "dep:bevy_svg",
  "dep:bevy_rapier2d",
  "dep:bevy_ui_widgets",
  # Terminal (TUI/CLI); the deps are no-ops on Android
  "dep:ratatui",
  "dep:ratatui-image",
  "dep:image",
  "dep:tui-popup",
  # Propagate to optional subsystems
  "sandpolis-account?/client",
  "sandpolis-audit?/client",
  "sandpolis-desktop?/client",
  "sandpolis-filesystem?/client",
  "sandpolis-health?/client",
  "sandpolis-inventory?/client",
  "sandpolis-probe?/client",
  "sandpolis-shell?/client",
  "sandpolis-snapshot?/client",
]

# Subsystems
account = ["dep:sandpolis-account"]
audit = ["dep:sandpolis-audit"]
desktop = ["dep:sandpolis-desktop"]
filesystem = ["dep:sandpolis-filesystem"]
health = ["dep:sandpolis-health"]
inventory = ["dep:sandpolis-inventory"]
shell = ["dep:sandpolis-shell"]
snapshot = ["dep:sandpolis-snapshot"]
probe = [
  "dep:sandpolis-probe",
  "sandpolis-shell?/probe",
  "sandpolis-desktop?/probe",
  "sandpolis-filesystem?/probe",
  "sandpolis-health?/probe",
]
tunnel = []

default = [
  "account",
  "audit",
  "desktop",
  "filesystem",
  "health",
  "inventory",
  "probe",
  "shell",
  "snapshot",
  "tunnel",
]

[[example]]
name = "client_tui_server_list"
required-features = ["client", "server"]

[[example]]
name = "client_gui_basic"
required-features = ["client"]

[[example]]
name = "client_gui_filesystem"
required-features = ["client", "filesystem"]

[[example]]
name = "client_gui_network"
required-features = ["client"]

[[example]]
name = "client_gui_activity"
required-features = ["client"]

[[example]]
name = "client_gui_panels"
required-features = ["client"]

[[example]]
name = "client_gui_notification"
required-features = ["client"]
