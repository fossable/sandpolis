<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Android robot -->
  <defs>
    <linearGradient id="androidGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3ddc84;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#20b463;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Antennae -->
  <path d="M 21 12 L 26 19 M 43 12 L 38 19"
        fill="none" stroke="#3ddc84" stroke-width="3" stroke-linecap="round"/>

  <!-- Head -->
  <path d="M 16 30 a 16 16 0 0 1 32 0 z" fill="url(#androidGradient)"/>
  <circle cx="25" cy="24" r="2.2" fill="#ffffff"/>
  <circle cx="39" cy="24" r="2.2" fill="#ffffff"/>

  <!-- Torso -->
  <rect x="16" y="33" width="32" height="20" rx="3" fill="url(#androidGradient)"/>

  <!-- Arms -->
  <rect x="8" y="33" width="6" height="18" rx="3" fill="url(#androidGradient)"/>
  <rect x="50" y="33" width="6" height="18" rx="3" fill="url(#androidGradient)"/>

  <!-- Legs -->
  <rect x="22" y="53" width="6" height="9" rx="3" fill="url(#androidGradient)"/>
  <rect x="36" y="53" width="6" height="9" rx="3" fill="url(#androidGradient)"/>
</svg>
