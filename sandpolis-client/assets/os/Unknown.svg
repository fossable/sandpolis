<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Stand-in for an OS we don't ship a mark for. Deliberately muted so it
       reads as "no data" rather than as a real platform. -->
  <defs>
    <linearGradient id="unknownGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#64748b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="26" fill="url(#unknownGradient)" stroke="#334155" stroke-width="3"/>

  <!-- Drawn rather than typeset: no font is guaranteed at render time. -->
  <path d="M 24 26 a 8 8 0 1 1 8 9 l 0 4"
        fill="none" stroke="#e2e8f0" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="32" cy="45" r="3" fill="#e2e8f0"/>
</svg>
